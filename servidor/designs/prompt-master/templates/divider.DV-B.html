<article class="{{cls}} ps-dB"{{&style_attr}} aria-label="Divisor {{number}}">
  <div class="ps-glow" aria-hidden="true"></div>
  <div class="ps-hd"><span>{{label}} {{number}} / {{total}}</span>{{&head_sym}}</div>
  <div class="ps-num" data-bleed aria-hidden="true">{{number}}</div>
  <h4 class="ps-ttl" data-fit="w">{{part.title}}</h4>
  <p class="ps-desc">{{part.desc}}</p>
  {{&loose_sym}}
</article>
