<article class="page cover cv2 grain" aria-label="Portada">
  <div class="cv-h"><div class="cv-h1 micro">{{&header_html}}</div><div class="cv-h3"><span class="caja">{{meta.version}}</span></div></div>
  <div class="cv2-t">{{#each words}}<div class="cv2-row" data-fit="f" data-maxh="{{mh}}"><span>{{text}}</span></div>{{/each}}</div>
  {{&syms}}
  <div class="cv-bot"><div class="cv-tit"><h2 data-fit="w">{{cover.title}}</h2><p class="micro">{{cover.text}}</p></div><div class="cv-pie micro"><span>{{meta.date}}</span>{{&foot_sym}}</div></div>
</article>
