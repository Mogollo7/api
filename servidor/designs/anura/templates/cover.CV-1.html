<article class="page cover grain" aria-label="Portada">
  <div class="cv-h"><div class="cv-h1 micro">{{&header_html}}</div><div class="cv-h3"><span class="caja">{{meta.version}}</span></div></div>
  <div class="cv-v{{#if cover.note}} cv-v-low{{/if}}" aria-hidden="true" data-fit="v">{{cover.vertical}}</div>
  <div class="cv-frame">{{#if img}}<img src="{{&img}}" alt="{{alt}}">{{/if}}</div>
  {{&syms}}
  <div class="cv-bot"><div class="cv-tit"><h2 data-fit="w">{{cover.title}}</h2><p class="micro{{#if cover.note}} cv-txt{{/if}}">{{cover.text}}</p>{{#if cover.note}}<p class="micro cv-note">{{cover.note}}</p>{{/if}}</div><div class="cv-pie micro"><span>{{meta.date}}</span>{{&foot_sym}}</div></div>
</article>
