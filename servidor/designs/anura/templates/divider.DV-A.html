<article class="{{cls}}"{{&style_attr}} aria-label="Divisor {{number}}">
  <div class="hd micro"><span>{{label}} {{number}} / {{total}}</span>{{&head_sym}}</div><div class="num" aria-hidden="true">{{number}}</div><h4 class="ttl" data-fit="w">{{part.title}}</h4><p class="{{desc_cls}}">{{part.desc}}</p>
  <div class="disc">{{#if img}}<img src="{{&img}}" alt="{{alt}}">{{/if}}</div>
  {{&loose_sym}}
</article>
