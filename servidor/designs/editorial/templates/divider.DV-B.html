<article class="{{cls}} ed-dB"{{&style_attr}} aria-label="Divisor {{number}}">
  <div class="ed-hd micro"><span>{{label}} {{number}} / {{total}}</span>{{&head_sym}}</div>
  <div class="ed-num" data-bleed aria-hidden="true">{{number}}</div>
  <h4 class="ed-ttl" data-fit="w">{{part.title}}</h4>
  <p class="ed-desc micro">{{part.desc}}</p>
  {{&loose_sym}}
</article>
