<article class="page cover ps-c2" aria-label="Portada">
  <div class="ps-glow" aria-hidden="true"></div>
  <div class="ps-top"><span class="ps-brand">{{&header_html}}</span><span class="ps-ver">{{meta.version}}</span></div>
  <div class="ps-big" data-fit="w" aria-hidden="true">{{cover.vertical}}</div>
  <h2 class="ps-title" data-fit="b">{{cover.title}}</h2>
  <p class="ps-sub">{{cover.text}}</p>
  {{&syms}}
  <div class="ps-foot"><span>{{meta.date}}</span>{{&foot_sym}}</div>
</article>
